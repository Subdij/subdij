<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="1000" height="30" aria-hidden="true">
<defs>
<linearGradient id="l" gradientUnits="userSpaceOnUse" x1="0" x2="1000"><stop offset="0" stop-color="#ff5fd2" stop-opacity="0"/><stop offset=".3" stop-color="#ff5fd2"/><stop offset=".5" stop-color="#e4af2d"/><stop offset=".7" stop-color="#ff5fd2"/><stop offset="1" stop-color="#ff5fd2" stop-opacity="0"/></linearGradient>
<radialGradient id="d"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ff5fd2" stop-opacity="0"/></radialGradient>
</defs>
<style>
.tw{animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.spin{animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.shoot{animation:shoot 8s ease-in infinite}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}2%{opacity:1}10%,100%{transform:translate(-380px,190px);opacity:0}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.travel{animation:travel 5s ease-in-out infinite}
@keyframes travel{from{transform:translateX(0)}to{transform:translateX(1000px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<line x1="0" y1="15" x2="1000" y2="15" stroke="url(#l)" stroke-width="2"/>
<g class="travel"><ellipse cx="0" cy="15" rx="40" ry="5" fill="url(#d)"/></g>
<g class="pulse"><path d="M500 4L502.42 12.58L511 15L502.42 17.42L500 26L497.58 17.42L489 15L497.58 12.58Z" fill="#e4af2d"/></g>
</svg>
